<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f2">
  <link rel="icon" href="data:,">
  <title>Focus Code · 变动时间线</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <a class="wordmark" href="/" aria-label="Focus Code 首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></span>Focus<span class="wordmark-code">Code</span></a>
      <div class="header-repo">
        <span class="icon folder" aria-hidden="true"></span>
        <select id="project" aria-label="切换工程"><option value="">加载工程…</option></select>
        <span class="divider" aria-hidden="true"></span>
        <select id="branch" aria-label="筛选 Git 分支" disabled><option value="">所有分支</option></select>
      </div>
      <div class="connection"><span id="demo" class="demo" hidden>演示数据</span><span id="signal" class="signal" aria-hidden="true"></span><span id="connection">连接中</span></div>
    </div>
  </header>
  <main class="page">
    <div class="page-heading">
      <h1>变动时间线</h1>
      <div class="heading-actions"><button type="button" id="add-project" class="button">＋ 添加工程</button><button type="button" id="refresh" class="button" title="刷新记录"><span class="refresh-icon" aria-hidden="true">↻</span> 刷新</button></div>
    </div>
    <div id="alert" class="alert" role="status" hidden></div>
    <div class="workbench">
      <aside class="timeline" aria-label="变动列表">
        <div class="timeline-top">
          <div class="timeline-heading"><h2>变动记录</h2><span id="count" class="count" aria-label="当前分支范围内的记录数">0</span></div>
          <label class="search"><span class="icon magnify" aria-hidden="true"></span><input id="search" type="search" aria-label="搜索文件或原因" placeholder="搜索文件或原因…"><kbd aria-hidden="true">/</kbd></label>
          <label class="select-wrap"><span class="icon filter" aria-hidden="true"></span><select id="source" aria-label="按来源筛选">
            <option value="">所有来源</option><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="pi">Pi</option><option value="opencode">OpenCode</option><option value="gemini">Gemini CLI</option><option value="trae">TRAE</option><option value="trae-cli">TRAE CLI</option><option value="workspace">工作区</option><option value="mixed">来源不明</option>
          </select><span class="chevron" aria-hidden="true">⌄</span></label>
        </div>
        <div id="timeline-list" class="timeline-list"></div>
        <button type="button" class="button more" id="more" hidden>加载更早记录</button>
      </aside>
      <section id="inspector" class="inspector" aria-label="变动详情">
        <div id="placeholder" class="placeholder" role="status"><span class="empty-symbol" aria-hidden="true">⌘</span><h2 id="placeholder-title">正在加载变动记录</h2><p id="placeholder-text"></p></div>
        <div id="detail" hidden>
          <div class="detail-top">
            <div class="detail-kicker"><span id="detail-source" class="source"></span><span id="detail-tool" class="tool"></span><time id="detail-time"></time></div>
            <h2 id="detail-title" class="detail-title"></h2>
            <div class="detail-metadata"><span class="detail-branch" id="detail-branch"></span><span id="detail-count"></span><span id="detail-stats"></span></div>
          </div>
          <section class="reason" aria-labelledby="reason-heading">
            <div class="reason-heading"><h3 id="reason-heading"><span class="icon note" aria-hidden="true"></span> 修改原因</h3><span id="reason-origin" class="reason-origin"></span><button type="button" class="button subtle" id="edit-reason">编辑</button></div>
            <p id="reason"></p>
            <form id="reason-form" hidden><label for="reason-input" class="sr-only">修改原因</label><textarea id="reason-input" maxlength="1000" rows="3" placeholder="这次修改要解决什么问题？"></textarea><div class="form-actions"><span id="reason-error" role="alert"></span><button type="button" class="button" id="cancel-reason">取消</button><button type="submit" class="button primary">保存</button></div></form>
          </section>
          <section aria-labelledby="files-heading" class="files-section">
            <h3 id="files-heading">受影响的文件 <span id="file-count" class="count"></span></h3>
            <div id="files" class="files"></div>
          </section>
          <section class="diff" aria-label="逐行差异">
            <div class="diff-toolbar"><span class="icon file" aria-hidden="true"></span><span id="diff-path"></span><label class="context-toggle"><input type="checkbox" id="context" checked> 显示上下文</label></div>
            <div id="diff-view" class="diff-view"></div>
          </section>
        </div>
      </section>
    </div>
    <footer id="root" class="page-footer"></footer>
    <dialog id="project-dialog" aria-labelledby="project-dialog-title">
      <form id="project-form">
        <h2 id="project-dialog-title">添加工程</h2>
        <label for="project-path">Git 工作树路径</label>
        <input id="project-path" required maxlength="4096" placeholder="/Users/you/projects/repo" spellcheck="false" autocomplete="off">
        <div class="form-actions"><span id="project-error" class="form-error" role="alert"></span><button type="button" class="button" id="cancel-project">取消</button><button class="button primary" type="submit">打开</button></div>
      </form>
    </dialog>
    <dialog id="hunk-dialog" aria-labelledby="hunk-dialog-title">
      <form id="hunk-form">
        <h2 id="hunk-dialog-title">编辑段落说明</h2>
        <p id="hunk-location" class="hunk-location"></p>
        <label for="hunk-explanation" class="sr-only">段落说明</label>
        <textarea id="hunk-explanation" maxlength="1000" rows="4" placeholder="这段修改解决了什么问题？"></textarea>
        <div class="form-actions"><span id="hunk-error" class="form-error" role="alert"></span><button type="button" class="button" id="cancel-hunk">取消</button><button class="button primary" type="submit">保存</button></div>
      </form>
    </dialog>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
